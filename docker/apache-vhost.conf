<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Defence in depth — the app's data/includes live outside the docroot,
    # but deny them explicitly in case the layout ever changes.
    <Directory /var/www/html/data>
        Require all denied
    </Directory>
    <Directory /var/www/html/includes>
        Require all denied
    </Directory>

    # Block dotfiles (.env, .git, …)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Compress text assets — the main stylesheet is ~52 KB uncompressed.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml \
            text/javascript application/javascript application/json \
            image/svg+xml
        Header append Vary Accept-Encoding
    </IfModule>

    # Assets are served with a ?v=<filemtime> cache-buster, so they can be
    # cached indefinitely. Uploaded photos use unique names and a shorter TTL.
    <Directory /var/www/html/public/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    <Directory /var/www/html/public/uploads>
        Header set Cache-Control "public, max-age=86400"
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
