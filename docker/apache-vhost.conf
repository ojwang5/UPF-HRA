<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Defence in depth — the app's data/includes live outside the docroot,
    # but deny them explicitly in case the layout ever changes.
    <Directory /var/www/html/data>
        Require all denied
    </Directory>
    <Directory /var/www/html/includes>
        Require all denied
    </Directory>

    # Block dotfiles (.env, .git, …)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
