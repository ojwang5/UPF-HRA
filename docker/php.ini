; ─────────────────────────────────────────────────────────────────────────
; UPF HRM — production PHP settings (loaded after the image defaults)
; ─────────────────────────────────────────────────────────────────────────

; Errors: never shown to users, always logged to the container stderr
expose_php            = Off
display_errors        = Off
display_startup_errors= Off
log_errors            = On
error_log             = /dev/stderr
error_reporting       = E_ALL

; Resource limits
memory_limit          = 256M
max_execution_time    = 120
max_input_time        = 120

; File uploads (personnel photos, CSV bulk import)
file_uploads          = On
upload_max_filesize   = 20M
post_max_size         = 22M
max_file_uploads      = 20

; Sessions — hardened defaults. The application enforces a 10-minute idle
; timeout, so keep the PHP garbage-collection lifetime comfortably larger.
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime  = 14400
session.save_path       = "/var/lib/php/sessions"
; Enable the line below only when the site is served over HTTPS:
; session.cookie_secure = 1

; Misc
date.timezone         = Africa/Kampala

; Opcode cache (APCu not required)
opcache.enable              = 1
opcache.enable_cli          = 0
opcache.memory_consumption  = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files   = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq     = 2
